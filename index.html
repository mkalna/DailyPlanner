<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Daily Planner</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#f7f5f0;--surface:#fff;--surface2:#f0ede6;--surface3:#e8e5dd;
  --border:rgba(0,0,0,.1);--border-md:rgba(0,0,0,.18);
  --text:#1a1814;--text-2:#6b6760;--text-3:#a09d97;
  --radius:14px;--radius-sm:8px;
  --shadow:0 1px 4px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.06);
  --chores-bg:#e4f5ec;--chores-bar:#1D9E75;--chores-txt:#085041;
  --projects-bg:#faeeda;--projects-bar:#BA7517;--projects-txt:#633806;
  --work-bg:#e6f1fb;--work-bar:#185FA5;--work-txt:#0C447C;
  --school-bg:#eeedfe;--school-bar:#534AB7;--school-txt:#3C3489;
  --fitness-bg:#faece7;--fitness-bar:#993C1D;--fitness-txt:#712B13;
  --calendar-bg:#fef3e2;--calendar-bar:#D4820C;--calendar-txt:#7A4A00;
  --meals-bg:#fce4ec;--meals-bar:#C62828;--meals-txt:#7f1616;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.shell{display:flex;min-height:100vh}
.sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:2rem 0;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar-logo{padding:0 1.5rem 1.5rem;border-bottom:1px solid var(--border);margin-bottom:1rem}
.logo-mark{font-family:'DM Serif Display',serif;font-size:20px;line-height:1.1}
.logo-sub{font-size:11px;color:var(--text-3);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.nav-label{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.1em;color:var(--text-3);padding:0 1.5rem;margin:1rem 0 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 1.5rem;font-size:14px;color:var(--text-2);cursor:pointer;transition:all .15s;border-left:2.5px solid transparent}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{color:var(--text);font-weight:500;background:var(--surface2);border-left-color:var(--text)}
.nav-cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.main{flex:1;padding:2rem 2.5rem;max-width:1100px;padding-bottom:80px}
.page{display:none}.page.active{display:block}
.page-title{font-family:'DM Serif Display',serif;font-size:26px;margin-bottom:4px}
.page-sub{font-size:14px;color:var(--text-2);margin-bottom:1.5rem}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:1.5rem}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px}
.stat-val{font-family:'DM Serif Display',serif;font-size:28px}
.stat-label{font-size:12px;color:var(--text-2);margin-top:2px}
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:1.5rem}
.cat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;cursor:pointer;transition:all .15s}
.cat-card:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.cat-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.cat-name{font-size:14px;font-weight:500;margin-bottom:4px}
.cat-count{font-size:12px;color:var(--text-3);margin-bottom:8px}
.cat-bar{height:4px;border-radius:2px;background:var(--surface2);overflow:hidden}
.cat-bar-fill{height:100%;border-radius:2px;transition:width .3s}
.cat-header{display:flex;align-items:center;gap:12px;margin-bottom:1.5rem}
.cat-header-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.back-btn{background:none;border:none;cursor:pointer;font-size:14px;color:var(--text-2);display:flex;align-items:center;gap:4px;margin-bottom:1rem}
.back-btn:hover{color:var(--text)}
.add-row{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;margin-bottom:1.5rem;align-items:end}
.add-row input,.add-row select{padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;background:var(--surface)}
.add-row input:focus,.add-row select:focus{outline:none;border-color:var(--border-md)}
.btn{padding:8px 18px;border-radius:var(--radius-sm);font-size:13px;font-family:inherit;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);transition:all .12s}
.btn:hover{background:var(--surface2)}
.btn-primary{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn-primary:hover{opacity:.85}
.btn-sm{padding:5px 12px;font-size:12px}
.task-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);transition:all .12s;margin-bottom:4px}
.task-row:hover{background:var(--surface2)}
.task-check{width:18px;height:18px;border-radius:50%;border:2px solid var(--border-md);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .12s}
.task-check.done{border-color:var(--chores-bar);background:var(--chores-bar)}
.task-check.done::after{content:'✓';color:#fff;font-size:11px;font-weight:600}
.task-text{flex:1;font-size:13px}
.task-text.done{text-decoration:line-through;color:var(--text-3)}
.task-meta{font-size:11px;color:var(--text-3);display:flex;gap:6px;align-items:center}
.task-tag{padding:2px 7px;border-radius:10px;font-size:10px;font-weight:500}
.task-actions{display:flex;gap:2px}
.task-actions button{background:none;border:none;cursor:pointer;color:var(--text-3);font-size:13px;padding:3px;border-radius:4px;transition:all .12s}
.task-actions button:hover{color:var(--text);background:var(--surface2)}
.edit-row{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;padding:10px 12px;background:var(--surface);border:1px solid var(--border-md);border-radius:var(--radius-sm);margin-bottom:4px}
.edit-row input,.edit-row select{padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;font-family:inherit}
.event-add-row{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;margin-bottom:1.5rem;align-items:end}
.event-add-row input{padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;background:var(--surface)}

/* Meals page split */
.meals-split{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.meals-col{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.meals-col-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.meals-col-title .dot{width:8px;height:8px;border-radius:50%}
.meals-add{display:flex;gap:8px;margin-bottom:12px}
.meals-add input{flex:1;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;font-family:inherit}
.meals-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--border);font-size:13px}
.meals-item:last-child{border-bottom:none}
.meals-item button{background:none;border:none;cursor:pointer;color:var(--text-3);font-size:14px}
.meals-item button:hover{color:var(--text)}

/* View tabs */
.view-tabs{display:flex;gap:4px;margin-bottom:1.5rem;background:var(--surface2);padding:4px;border-radius:var(--radius-sm);width:fit-content}
.view-tab{padding:7px 20px;border-radius:6px;font-size:13px;font-weight:500;border:none;background:none;cursor:pointer;color:var(--text-2);font-family:inherit;transition:all .12s}
.view-tab.active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.view-tab:hover:not(.active){color:var(--text)}
.sched-nav{display:flex;align-items:center;gap:10px;margin-bottom:1.5rem;flex-wrap:wrap}
.sched-nav-label{font-family:'DM Serif Display',serif;font-size:18px;min-width:180px}

/* Assign panel */
.assign-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:1.5rem}
.assign-panel-title{font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);margin-bottom:10px}
.assign-cat-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.assign-cat-btn{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:500;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-family:inherit;transition:all .12s;display:flex;align-items:center;gap:5px}
.assign-cat-btn:hover{background:var(--surface2)}
.assign-cat-btn.active{border-color:var(--text);background:var(--text);color:var(--bg)}
.assign-task-list{max-height:220px;overflow-y:auto;margin-bottom:12px;border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px}
.assign-task-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:4px;cursor:pointer;transition:background .1s;font-size:13px}
.assign-task-item:hover{background:var(--surface2)}
.assign-task-item input[type=checkbox]{width:16px;height:16px;accent-color:var(--text);cursor:pointer}
.assign-task-item.checked{background:var(--surface2)}
.assign-bottom{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.assign-bottom select,.assign-bottom input{padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;font-family:inherit}
.assign-msg{font-size:12px;color:var(--chores-bar);margin-left:8px}

/* Month grid */
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.month-head-cell{background:var(--surface2);padding:8px;text-align:center;font-size:12px;font-weight:500;color:var(--text-2)}
.month-cell{background:var(--surface);padding:8px;min-height:80px;cursor:pointer;transition:background .12s}
.month-cell:hover{background:var(--surface2)}
.month-cell.today{background:#f5f0ff;box-shadow:inset 0 0 0 2px var(--school-bar)}
.month-cell.other-month{opacity:.35}
.month-cell-num{font-size:13px;font-weight:500;margin-bottom:4px}
.month-cell-badges{display:flex;gap:4px;flex-wrap:wrap}
.month-badge{font-size:10px;padding:1px 6px;border-radius:8px;font-weight:500}

/* Week grid */
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin-bottom:1.5rem}
.day-col{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);min-height:180px;display:flex;flex-direction:column;overflow:hidden;transition:box-shadow .15s}
.day-col.today{border-color:var(--text);border-width:2px}
.day-col.drag-over{box-shadow:inset 0 0 0 2px var(--work-bar);background:var(--work-bg)}
.day-head{padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px;font-weight:500;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.day-head:hover{background:var(--surface2)}
.day-head-date{font-size:11px;color:var(--text-3);font-weight:400}
.day-body{padding:8px;flex:1;display:flex;flex-direction:column;gap:3px;min-height:80px}
.day-body .task-row{padding:6px 7px}
.day-body .task-text{font-size:11px}
.day-body .task-actions button{font-size:11px;padding:2px}
.day-body .task-tag{font-size:9px;padding:1px 5px}
.day-event{padding:4px 7px;background:var(--calendar-bg);border-radius:var(--radius-sm);font-size:10px;color:var(--calendar-txt);margin-bottom:2px;border-left:2px solid var(--calendar-bar)}
.day-drop-zone{flex:1;min-height:24px;border:1px dashed transparent;border-radius:var(--radius-sm);transition:all .15s;display:flex;align-items:center;justify-content:center}
.day-drop-zone.active{border-color:var(--border-md);background:var(--surface2)}
.day-drop-hint{font-size:9px;color:var(--text-3);display:none}
.day-drop-zone.active .day-drop-hint{display:block}

/* Day view */
.day-view{max-width:780px}
.day-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.day-section-title{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.day-section-title .dot{width:8px;height:8px;border-radius:50%}
.log-form{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.log-field{display:flex;flex-direction:column;gap:6px}
.log-field.full{grid-column:1/-1}
.log-field-label{font-size:12px;font-weight:500;color:var(--text-2)}
.log-field input,.log-field textarea{padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;background:var(--surface)}
.log-field input:focus,.log-field textarea:focus{outline:none;border-color:var(--border-md)}
.log-field textarea{resize:none;height:40px}
.mood-row{display:flex;gap:8px}
.mood-btn{width:44px;height:44px;border:2px solid var(--border);border-radius:var(--radius-sm);background:none;cursor:pointer;font-size:22px;display:flex;align-items:center;justify-content:center;transition:all .12s}
.mood-btn:hover{background:var(--surface2);border-color:var(--border-md)}
.mood-btn.sel{background:var(--surface3);border-color:var(--text)}
.energy-slider{display:flex;align-items:center;gap:12px}
.energy-slider span{font-size:12px;color:var(--text-3)}
.energy-slider input[type=range]{flex:1;accent-color:var(--text)}
.energy-val{font-size:18px;font-weight:600;min-width:24px;text-align:center}
.day-event-row{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--calendar-bg);border-radius:var(--radius-sm);margin-bottom:6px;border-left:3px solid var(--calendar-bar)}
.day-event-row-time{font-size:13px;font-weight:500;color:var(--calendar-txt);min-width:100px}
.day-event-row-name{flex:1;font-size:14px;color:var(--calendar-txt)}

/* Timeline */
.timeline-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:16px}
.timeline-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.timeline-header-title{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.timeline{position:relative;min-height:200px}
.timeline-hour-row{display:flex;align-items:flex-start;border-bottom:1px solid rgba(0,0,0,.04);min-height:60px;position:relative}
.timeline-hour-label{width:64px;padding:4px 12px 0 0;text-align:right;font-size:11px;color:var(--text-3);font-weight:500;flex-shrink:0;position:sticky;left:0}
.timeline-hour-content{flex:1;min-height:60px;position:relative;border-left:1px solid var(--border)}
.timeline-half{position:absolute;left:0;right:0;top:50%;border-top:1px dashed rgba(0,0,0,.04)}
.timeline-block{position:relative;margin:2px 6px;padding:8px 12px;border-radius:var(--radius-sm);cursor:grab;transition:box-shadow .15s,transform .15s;display:flex;align-items:flex-start;gap:10px;min-height:36px;user-select:none}
.timeline-block:hover{box-shadow:0 2px 8px rgba(0,0,0,.1);transform:translateY(-1px)}
.timeline-block.dragging{opacity:.5;transform:scale(.97)}
.timeline-block-event{background:var(--calendar-bg);border-left:3px solid var(--calendar-bar);cursor:default}
.timeline-block-task{border-left:3px solid var(--text-3)}
.timeline-block-check{width:16px;height:16px;border-radius:50%;border:2px solid var(--border-md);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:1px;transition:all .12s}
.timeline-block-check.done{border-color:var(--chores-bar);background:var(--chores-bar)}
.timeline-block-check.done::after{content:'✓';color:#fff;font-size:10px;font-weight:600}
.timeline-block-body{flex:1;min-width:0}
.timeline-block-name{font-size:13px;font-weight:500;line-height:1.3}
.timeline-block-name.done{text-decoration:line-through;color:var(--text-3)}
.timeline-block-meta{font-size:11px;color:var(--text-2);margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.timeline-block-actions{display:flex;gap:2px;flex-shrink:0}
.timeline-block-actions button{background:none;border:none;cursor:pointer;color:var(--text-3);font-size:12px;padding:3px;border-radius:4px;transition:all .12s}
.timeline-block-actions button:hover{color:var(--text);background:var(--surface2)}
.timeline-drop-indicator{height:3px;background:var(--work-bar);border-radius:2px;margin:0 6px;transition:opacity .1s;opacity:0;pointer-events:none}
.timeline-drop-indicator.visible{opacity:1}
.timeline-unscheduled{padding:16px 20px;border-top:1px solid var(--border)}
.timeline-unscheduled-title{font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);margin-bottom:10px}
.timeline-unscheduled-item{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--surface2);border-radius:var(--radius-sm);margin-bottom:4px;cursor:grab;transition:all .12s}
.timeline-unscheduled-item:hover{background:var(--surface3)}
.time-picker-inline{display:flex;gap:4px;align-items:center}
.time-picker-inline select{padding:3px 4px;border:1px solid var(--border);border-radius:4px;font-size:11px;font-family:inherit;background:var(--surface);cursor:pointer}
.time-picker-inline select:focus{outline:none;border-color:var(--border-md)}

.ai-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-top:1rem}
.ai-box h3{font-family:'DM Serif Display',serif;font-size:18px;margin-bottom:12px}
.ai-result{font-size:14px;line-height:1.7;color:var(--text);white-space:pre-wrap;margin-top:12px}

/* Data */
.range-tabs{display:flex;gap:6px;margin-bottom:1.5rem}
.range-tab{padding:7px 16px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);font-size:13px;font-family:inherit;cursor:pointer;color:var(--text-2)}
.range-tab.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.custom-range{display:none;gap:10px;align-items:center;margin-bottom:1rem;font-size:13px}
.custom-range.show{display:flex}
.custom-range input{padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;font-family:inherit}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:1.5rem}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;overflow:hidden}
.chart-card.full{grid-column:1/-1}
.chart-title{font-size:14px;font-weight:500;margin-bottom:4px}
.chart-subtitle{font-size:11px;color:var(--text-3);margin-bottom:12px}
.chart-empty{text-align:center;color:var(--text-3);font-size:13px;padding:3rem 1rem}

@media(max-width:900px){.week-grid{grid-template-columns:1fr;gap:8px}.meals-split{grid-template-columns:1fr}}
@media(max-width:680px){.sidebar{display:none}.main{padding:1.25rem;max-width:100%}.cat-grid{grid-template-columns:1fr 1fr;gap:10px}.stats-row{grid-template-columns:repeat(2,1fr)}.chart-grid{grid-template-columns:1fr}.add-row{grid-template-columns:1fr 1fr}.add-row .btn-primary{grid-column:1/-1}.mobile-nav{display:flex}.log-form{grid-template-columns:1fr}.meals-split{grid-template-columns:1fr}}
.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);z-index:100}
.mob-btn{flex:1;padding:12px 4px 10px;background:none;border:none;cursor:pointer;font-size:10px;color:var(--text-3);font-family:'DM Sans',sans-serif;display:flex;flex-direction:column;align-items:center;gap:3px}
.mob-btn.active{color:var(--text);font-weight:500}
.mob-icon{font-size:18px}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="sidebar-logo"><div class="logo-mark">Daily<br>Planner</div><div class="logo-sub">Stay organized</div></div>
    <div class="nav-label">Overview</div>
    <div class="nav-item active" onclick="showPage('home',this)">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><rect x="1" y="1" width="5.5" height="5.5" rx="1.5" fill="currentColor" opacity=".4"/><rect x="8.5" y="1" width="5.5" height="5.5" rx="1.5" fill="currentColor"/><rect x="1" y="8.5" width="5.5" height="5.5" rx="1.5" fill="currentColor"/><rect x="8.5" y="8.5" width="5.5" height="5.5" rx="1.5" fill="currentColor" opacity=".4"/></svg>
      Dashboard</div>
    <div class="nav-item" onclick="showPage('schedule',this)">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><rect x="1.5" y="2.5" width="12" height="10" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M1.5 5.5h12" stroke="currentColor" stroke-width="1.3"/></svg>
      Schedule</div>
    <div class="nav-item" onclick="showPage('data',this)">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M2 12l3-4 3 2 4-7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 13h11" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      Data &amp; Trends</div>
    <div class="nav-label">Categories</div>
    <div id="nav-cats"></div>
  </aside>
  <main class="main">
    <div class="page active" id="page-home"><div class="page-title">Dashboard</div><div class="page-sub">Your overview</div><div class="stats-row" id="stats-row"></div><div class="cat-grid" id="cat-grid"></div></div>
    <div class="page" id="page-cat"><button class="back-btn" onclick="showPage('home')">← Back</button><div class="cat-header" id="cat-header"></div><div id="cat-add-form"></div><div id="cat-task-list"></div></div>
    <div class="page" id="page-meals"><button class="back-btn" onclick="showPage('home')">← Back</button>
      <div class="cat-header"><div class="cat-header-icon" style="background:var(--meals-bg)"><svg width="18" height="18" viewBox="0 0 16 16" fill="none"><path d="M3 2v12M5 2v5a2 2 0 01-4 0V2M13 2v12M11 2v3c0 1.1.9 2 2 2s2-.9 2-2V2" stroke="var(--meals-bar)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div><div class="page-title" style="font-size:22px">Meals</div><div class="page-sub" style="margin-bottom:0">Groceries &amp; meal ideas</div></div></div>
      <div class="meals-split"><div class="meals-col" id="grocery-col"></div><div class="meals-col" id="meals-col"></div></div>
    </div>
    <div class="page" id="page-calendar"><button class="back-btn" onclick="showPage('home')">← Back</button>
      <div class="cat-header"><div class="cat-header-icon" style="background:var(--calendar-bg)"><svg width="18" height="18" viewBox="0 0 16 16" fill="none"><rect x="2" y="3" width="12" height="10" rx="1.5" stroke="var(--calendar-bar)" stroke-width="1.4"/><path d="M2 6h12" stroke="var(--calendar-bar)" stroke-width="1.4"/><path d="M5 1.5v3M11 1.5v3" stroke="var(--calendar-bar)" stroke-width="1.4" stroke-linecap="round"/></svg></div>
        <div><div class="page-title" style="font-size:22px">Calendar Events</div><div class="page-sub" style="margin-bottom:0">Events appear in your schedule</div></div></div>
      <div style="display:flex;align-items:center;gap:12px;margin:1rem 0 1.5rem">
        <button class="btn btn-sm" onclick="shiftEventDate(-1)">←</button>
        <input type="date" id="event-date" style="padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;font-family:inherit" onchange="renderCalendarPage()"/>
        <button class="btn btn-sm" onclick="shiftEventDate(1)">→</button>
        <button class="btn btn-sm" onclick="setEventDateToday()">Today</button></div>
      <div class="event-add-row"><input type="text" id="event-name" placeholder="Event name"/><input type="time" id="event-start"/><input type="time" id="event-end"/><button class="btn btn-primary" onclick="addEvent()">+ Add</button></div>
      <div id="event-list"></div>
    </div>
    <div class="page" id="page-schedule"><div class="page-title">Schedule</div><div class="page-sub">Plan, assign, and log</div>
      <div class="view-tabs"><button class="view-tab active" onclick="setView('month',this)">Month</button><button class="view-tab" onclick="setView('week',this)">Week</button><button class="view-tab" onclick="setView('day',this)">Day</button></div>
      <div id="schedule-content"></div>
    </div>
    <div class="page" id="page-data"><div class="page-title">Data &amp; Trends</div><div class="page-sub">Track patterns over time</div>
      <div class="range-tabs"><button class="range-tab active" onclick="setRange('7',this)">7 days</button><button class="range-tab" onclick="setRange('30',this)">30 days</button><button class="range-tab" onclick="setRange('custom',this)">Custom</button></div>
      <div class="custom-range" id="custom-range"><label>From <input type="date" id="data-from"/></label><label>To <input type="date" id="data-to"/></label><button class="btn btn-sm btn-primary" onclick="renderDataPage()">Apply</button></div>
      <div class="chart-grid" id="chart-grid"></div>
    </div>
  </main>
</div>
<nav class="mobile-nav">
  <button class="mob-btn active" onclick="showPage('home',this)" data-mob="home"><span class="mob-icon">⊞</span>Home</button>
  <button class="mob-btn" onclick="showPage('schedule',this)" data-mob="schedule"><span class="mob-icon">📅</span>Schedule</button>
  <button class="mob-btn" onclick="showPage('data',this)" data-mob="data"><span class="mob-icon">📊</span>Data</button>
</nav>
<script>
const CATS=[
  {id:'chores',name:'Chores',bg:'--chores-bg',bar:'--chores-bar',txt:'--chores-txt'},
  {id:'projects',name:'House projects',bg:'--projects-bg',bar:'--projects-bar',txt:'--projects-txt'},
  {id:'work',name:'Work tasks',bg:'--work-bg',bar:'--work-bar',txt:'--work-txt'},
  {id:'school',name:'School',bg:'--school-bg',bar:'--school-bar',txt:'--school-txt'},
  {id:'fitness',name:'Fitness',bg:'--fitness-bg',bar:'--fitness-bar',txt:'--fitness-txt'},
];
const ICONS={chores:`<path d="M3 12h10M5 12V7l3-2.5L11 7v5M7 12V9.5h2V12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>`,projects:`<path d="M2 11l3-3 2.5 2.5 3-4 3 4.5M2 4h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>`,work:`<rect x="2" y="4" width="12" height="9" rx="1.5" stroke="currentColor" stroke-width="1.5"/><path d="M5 4V3h6v1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>`,school:`<path d="M8 2L2 5l6 3 6-3-6-3zM2 5v5M5 6.5v3.5l3 1.5 3-1.5V6.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>`,fitness:`<path d="M2 8h12M4 5v6M12 5v6M6 6.5v3M10 6.5v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>`};
const DAYNAMES=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const STORE_KEY='dp-v7';
let tasks={chores:[],projects:[],work:[],school:[],fitness:[]};
let calEvents={};let weekAssignments={};let dailyLogs={};
let groceryList=[];let mealIdeas=[];
let nid=1;let activeCat=null;let editingId=null;
let currentView='month';let viewMonth=new Date();let weekStart=null;let viewDay=todayStr();
let assignCat='';let assignSelected=[];

function todayStr(){return fmtDate(new Date())}
function fmtDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parseDate(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function getMonday(d){const dt=new Date(d);const day=dt.getDay();const diff=dt.getDate()-day+(day===0?-6:1);return new Date(dt.setDate(diff))}
function getWeekDates(mon){const ds=[];for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(d.getDate()+i);ds.push(fmtDate(d))}return ds}
function fmtTime(t){if(!t)return'';const[h,m]=t.split(':').map(Number);return(h%12||12)+':'+String(m).padStart(2,'0')+(h>=12?' PM':' AM')}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function findTask(catId,taskId){return tasks[catId]?.find(t=>t.id===taskId)}

try{const raw=localStorage.getItem(STORE_KEY);if(raw){const d=JSON.parse(raw);if(d.tasks)tasks=d.tasks;if(d.calEvents)calEvents=d.calEvents;if(d.weekAssignments)weekAssignments=d.weekAssignments;if(d.dailyLogs)dailyLogs=d.dailyLogs;if(d.groceryList)groceryList=d.groceryList;if(d.mealIdeas)mealIdeas=d.mealIdeas;if(d.nid)nid=d.nid}}catch(e){}
if(!localStorage.getItem(STORE_KEY)){for(const k of['dp-v6','dp-v5','dp-v4']){try{const raw=localStorage.getItem(k);if(raw){const d=JSON.parse(raw);if(d.tasks)tasks=d.tasks;if(d.calEvents)calEvents=d.calEvents;if(d.weekAssignments)weekAssignments=d.weekAssignments;if(d.dailyLogs)dailyLogs=d.dailyLogs;if(d.nid)nid=d.nid;save();break}}catch(e){}}}
function save(){localStorage.setItem(STORE_KEY,JSON.stringify({tasks,calEvents,weekAssignments,dailyLogs,groceryList,mealIdeas,nid}))}
weekStart=getMonday(new Date());

/* NAV */
function showPage(id,el){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('page-'+id)?.classList.add('active');document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));if(el?.classList)el.classList.add('active');document.querySelectorAll('.mob-btn').forEach(b=>b.classList.toggle('active',b.dataset.mob===id));if(id==='home')renderHome();if(id==='schedule')renderSchedule();if(id==='calendar')renderCalendarPage();if(id==='data')renderDataPage();if(id==='meals')renderMealsPage()}
function gocat(cid){activeCat=cid;showPage('cat');renderCatPage(cid);document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));document.querySelector(`[data-cat="${cid}"]`)?.classList.add('active')}

/* SIDEBAR */
function buildSidebarCats(){
  const el=document.getElementById('nav-cats');
  let h=`<div class="nav-item" data-cat="calendar" onclick="showPage('calendar',this)"><span class="nav-cat-dot" style="background:var(--calendar-bar)"></span>Calendar events</div>`;
  h+=`<div class="nav-item" data-cat="meals" onclick="showPage('meals',this)"><span class="nav-cat-dot" style="background:var(--meals-bar)"></span>Meals</div>`;
  CATS.forEach(c=>{h+=`<div class="nav-item" data-cat="${c.id}" onclick="gocat('${c.id}')"><span class="nav-cat-dot" style="background:var(${c.bar})"></span>${c.name}<span style="margin-left:auto;font-size:11px;color:var(--text-3)">${tasks[c.id].length}</span></div>`});
  el.innerHTML=h;
}

/* HOME */
function renderHome(){
  const totalTasks=CATS.reduce((s,c)=>s+tasks[c.id].length,0);const doneTasks=CATS.reduce((s,c)=>s+tasks[c.id].filter(t=>t.done).length,0);const wd=getWeekDates(weekStart);const wa=wd.reduce((s,d)=>(weekAssignments[d]||[]).length+s,0);const we=wd.reduce((s,d)=>(calEvents[d]||[]).length+s,0);
  document.getElementById('stats-row').innerHTML=`<div class="stat-card"><div class="stat-val">${totalTasks}</div><div class="stat-label">Total tasks</div></div><div class="stat-card"><div class="stat-val">${doneTasks}</div><div class="stat-label">Completed</div></div><div class="stat-card"><div class="stat-val">${wa}</div><div class="stat-label">Assigned this week</div></div><div class="stat-card"><div class="stat-val">${we}</div><div class="stat-label">Events this week</div></div>`;
  let h=`<div class="cat-card" onclick="showPage('calendar')"><div class="cat-icon" style="background:var(--calendar-bg)"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="3" width="12" height="10" rx="1.5" stroke="var(--calendar-bar)" stroke-width="1.4"/><path d="M2 6h12" stroke="var(--calendar-bar)" stroke-width="1.4"/><path d="M5 1.5v3M11 1.5v3" stroke="var(--calendar-bar)" stroke-width="1.4" stroke-linecap="round"/></svg></div><div class="cat-name">Calendar Events</div><div class="cat-count">${(calEvents[todayStr()]||[]).length} today</div><div class="cat-bar"><div class="cat-bar-fill" style="width:100%;background:var(--calendar-bar);opacity:.3"></div></div></div>`;
  h+=`<div class="cat-card" onclick="showPage('meals')"><div class="cat-icon" style="background:var(--meals-bg)"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 2v12M5 2v5a2 2 0 01-4 0V2M13 2v12M11 2v3c0 1.1.9 2 2 2s2-.9 2-2V2" stroke="var(--meals-bar)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="cat-name">Meals</div><div class="cat-count">${groceryList.length} grocery · ${mealIdeas.length} ideas</div><div class="cat-bar"><div class="cat-bar-fill" style="width:100%;background:var(--meals-bar);opacity:.3"></div></div></div>`;
  CATS.forEach(c=>{const t=tasks[c.id];const done=t.filter(x=>x.done).length;const pct=t.length?Math.round(done/t.length*100):0;h+=`<div class="cat-card" onclick="gocat('${c.id}')"><div class="cat-icon" style="background:var(${c.bg})"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="color:var(${c.bar})">${ICONS[c.id]}</svg></div><div class="cat-name">${c.name}</div><div class="cat-count">${t.length} task${t.length!==1?'s':''} · ${pct}% done</div><div class="cat-bar"><div class="cat-bar-fill" style="width:${pct}%;background:var(${c.bar})"></div></div></div>`});
  document.getElementById('cat-grid').innerHTML=h;buildSidebarCats();
}

/* MEALS PAGE */
function renderMealsPage(){
  let gh=`<div class="meals-col-title"><span class="dot" style="background:var(--chores-bar)"></span>Grocery List</div>
    <div class="meals-add"><input type="text" id="grocery-inp" placeholder="Add item..." onkeydown="if(event.key==='Enter')addGrocery()"/><button class="btn btn-primary btn-sm" onclick="addGrocery()">+</button></div>`;
  groceryList.forEach((item,i)=>{gh+=`<div class="meals-item"><span style="flex:1">${esc(item)}</span><button onclick="groceryList.splice(${i},1);save();renderMealsPage()">✕</button></div>`});
  if(!groceryList.length)gh+=`<div style="color:var(--text-3);font-size:13px;padding:8px">No items yet</div>`;
  document.getElementById('grocery-col').innerHTML=gh;

  let mh=`<div class="meals-col-title"><span class="dot" style="background:var(--meals-bar)"></span>Meal Ideas</div>
    <div class="meals-add"><input type="text" id="meal-inp" placeholder="Add meal idea..." onkeydown="if(event.key==='Enter')addMealIdea()"/><button class="btn btn-primary btn-sm" onclick="addMealIdea()">+</button></div>`;
  mealIdeas.forEach((item,i)=>{mh+=`<div class="meals-item"><span style="flex:1">${esc(item)}</span><button onclick="mealIdeas.splice(${i},1);save();renderMealsPage()">✕</button></div>`});
  if(!mealIdeas.length)mh+=`<div style="color:var(--text-3);font-size:13px;padding:8px">No ideas yet</div>`;
  document.getElementById('meals-col').innerHTML=mh;
}
function addGrocery(){const inp=document.getElementById('grocery-inp');const v=inp.value.trim();if(!v)return;groceryList.push(v);inp.value='';save();renderMealsPage()}
function addMealIdea(){const inp=document.getElementById('meal-inp');const v=inp.value.trim();if(!v)return;mealIdeas.push(v);inp.value='';save();renderMealsPage()}

/* CATEGORY PAGE */
function renderCatPage(cid){
  const cat=CATS.find(c=>c.id===cid);if(!cat)return;
  document.getElementById('cat-header').innerHTML=`<div class="cat-header-icon" style="background:var(${cat.bg})"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" style="color:var(${cat.bar})">${ICONS[cid]}</svg></div><div><div class="page-title" style="font-size:22px">${cat.name}</div><div class="page-sub" style="margin-bottom:0">${tasks[cid].length} tasks · ${tasks[cid].filter(t=>t.done).length} done</div></div>`;
  document.getElementById('cat-add-form').innerHTML=`<div class="add-row"><input type="text" id="${cid}-inp" placeholder="Add a new task..." onkeydown="if(event.key==='Enter')addTask('${cid}')"/><select id="${cid}-dur"><option value="">Duration</option><option value="15m">15 min</option><option value="30m">30 min</option><option value="45m">45 min</option><option value="1h">1 hr</option><option value="1.5h">1.5 hr</option><option value="2h">2 hr</option><option value="3h">3 hr</option></select><input type="date" id="${cid}-due"/><button class="btn btn-primary" onclick="addTask('${cid}')">+ Add</button></div>`;
  let h='';
  tasks[cid].forEach(t=>{
    if(editingId===t.id){h+=`<div class="edit-row"><input type="text" id="edit-text" value="${esc(t.text)}" onkeydown="if(event.key==='Enter')saveEdit('${cid}',${t.id})"/><select id="edit-dur"><option value="">—</option><option value="15m" ${t.dur==='15m'?'selected':''}>15m</option><option value="30m" ${t.dur==='30m'?'selected':''}>30m</option><option value="45m" ${t.dur==='45m'?'selected':''}>45m</option><option value="1h" ${t.dur==='1h'?'selected':''}>1h</option><option value="1.5h" ${t.dur==='1.5h'?'selected':''}>1.5h</option><option value="2h" ${t.dur==='2h'?'selected':''}>2h</option><option value="3h" ${t.dur==='3h'?'selected':''}>3h</option></select><input type="date" id="edit-due" value="${t.due||''}"/><div style="display:flex;gap:4px"><button class="btn btn-primary btn-sm" onclick="saveEdit('${cid}',${t.id})">Save</button><button class="btn btn-sm" onclick="cancelEdit('${cid}')">Cancel</button></div></div>`}
    else{h+=`<div class="task-row"><div class="task-check ${t.done?'done':''}" onclick="toggleTask('${cid}',${t.id})"></div><div class="task-text ${t.done?'done':''}">${esc(t.text)}</div><div class="task-meta">${t.dur?`<span class="task-tag" style="background:var(${cat.bg});color:var(${cat.txt})">${t.dur}</span>`:''}${t.due?`<span>${t.due}</span>`:''}</div><div class="task-actions"><button title="Edit" onclick="startEdit(${t.id},'${cid}')">✎</button><button title="Delete" onclick="deleteTask('${cid}',${t.id})">✕</button></div></div>`}
  });
  document.getElementById('cat-task-list').innerHTML=h||'<div style="text-align:center;color:var(--text-3);padding:2rem;font-size:14px">No tasks yet</div>';
}
function addTask(cid){const inp=document.getElementById(`${cid}-inp`);const dur=document.getElementById(`${cid}-dur`);const due=document.getElementById(`${cid}-due`);const txt=inp.value.trim();if(!txt)return;tasks[cid].push({id:nid++,text:txt,done:false,dur:dur?dur.value:'',due:due?due.value:''});inp.value='';if(dur)dur.selectedIndex=0;if(due)due.value='';save();renderCatPage(cid);buildSidebarCats()}
function toggleTask(cid,id){const t=tasks[cid].find(x=>x.id===id);if(t)t.done=!t.done;save();renderCatPage(cid)}
function deleteTask(cid,id){tasks[cid]=tasks[cid].filter(x=>x.id!==id);save();renderCatPage(cid);buildSidebarCats()}
function startEdit(id,cid){editingId=id;renderCatPage(cid)}
function cancelEdit(cid){editingId=null;renderCatPage(cid)}
function saveEdit(cid,id){const t=tasks[cid].find(x=>x.id===id);if(!t)return;t.text=document.getElementById('edit-text').value.trim()||t.text;t.dur=document.getElementById('edit-dur').value;t.due=document.getElementById('edit-due').value;editingId=null;save();renderCatPage(cid)}

/* CALENDAR EVENTS */
let currentEventDate=todayStr();
function renderCalendarPage(){currentEventDate=document.getElementById('event-date').value||currentEventDate;document.getElementById('event-date').value=currentEventDate;const evts=(calEvents[currentEventDate]||[]).slice().sort((a,b)=>(a.start||'').localeCompare(b.start||''));let h='';if(!evts.length)h='<div style="text-align:center;color:var(--text-3);padding:2rem;font-size:14px">No events</div>';else evts.forEach((ev,i)=>{const ts=ev.start?(ev.end?fmtTime(ev.start)+' – '+fmtTime(ev.end):fmtTime(ev.start)):'No time';h+=`<div class="task-row" style="margin-bottom:4px"><div style="font-size:12px;font-weight:500;color:var(--calendar-txt);min-width:100px">${ts}</div><div class="task-text">${esc(ev.name)}</div><div class="task-actions"><button onclick="deleteEvent('${currentEventDate}',${i})">✕</button></div></div>`});document.getElementById('event-list').innerHTML=h}
function addEvent(){const name=document.getElementById('event-name').value.trim();if(!name)return;const start=document.getElementById('event-start').value;const end=document.getElementById('event-end').value;if(!calEvents[currentEventDate])calEvents[currentEventDate]=[];calEvents[currentEventDate].push({name,start,end});document.getElementById('event-name').value='';document.getElementById('event-start').value='';document.getElementById('event-end').value='';save();renderCalendarPage()}
function deleteEvent(date,idx){if(calEvents[date]){calEvents[date].splice(idx,1);if(!calEvents[date].length)delete calEvents[date];save();renderCalendarPage()}}
function shiftEventDate(dir){const d=parseDate(currentEventDate);d.setDate(d.getDate()+dir);currentEventDate=fmtDate(d);document.getElementById('event-date').value=currentEventDate;renderCalendarPage()}
function setEventDateToday(){currentEventDate=todayStr();document.getElementById('event-date').value=currentEventDate;renderCalendarPage()}

/* ============ ASSIGN PANEL (shared) ============ */
function renderAssignPanel(){
  const allCats=CATS;
  let h=`<div class="assign-panel"><div class="assign-panel-title">Assign tasks to schedule</div>`;
  h+=`<div class="assign-cat-tabs">`;
  allCats.forEach(c=>{h+=`<button class="assign-cat-btn ${assignCat===c.id?'active':''}" onclick="pickAssignCat('${c.id}')">${c.name}</button>`});
  h+=`</div>`;
  if(assignCat){
    const pending=tasks[assignCat].filter(t=>!t.done);
    h+=`<div class="assign-task-list">`;
    if(pending.length){
      pending.forEach(t=>{
        const checked=assignSelected.includes(t.id);
        h+=`<div class="assign-task-item ${checked?'checked':''}" onclick="toggleAssignSelect(${t.id})"><input type="checkbox" ${checked?'checked':''} onclick="event.stopPropagation();toggleAssignSelect(${t.id})"/><span style="flex:1">${esc(t.text)}</span>${t.dur?`<span class="task-tag" style="background:var(--surface2);color:var(--text-2)">${t.dur}</span>`:''}</div>`;
      });
    } else {h+=`<div style="padding:12px;color:var(--text-3);font-size:13px;text-align:center">No pending tasks in this category</div>`}
    h+=`</div>`;
    if(assignSelected.length){
      h+=`<div class="assign-bottom"><input type="date" id="assign-date" value="${viewDay||todayStr()}"/><button class="btn btn-primary" onclick="batchAssign()">Assign ${assignSelected.length} task${assignSelected.length>1?'s':''}</button><span class="assign-msg" id="assign-msg"></span></div>`;
    }
  } else {
    h+=`<div style="padding:16px;color:var(--text-3);font-size:13px;text-align:center">Pick a category above to see tasks</div>`;
  }
  h+=`</div>`;
  return h;
}
function pickAssignCat(cid){assignCat=cid;assignSelected=[];renderSchedule()}
function toggleAssignSelect(id){if(assignSelected.includes(id))assignSelected=assignSelected.filter(x=>x!==id);else assignSelected.push(id);renderSchedule()}
function batchAssign(){
  const dateEl=document.getElementById('assign-date');
  const date=dateEl?dateEl.value:todayStr();
  if(!date||!assignCat||!assignSelected.length)return;
  if(!weekAssignments[date])weekAssignments[date]=[];
  let added=0;
  assignSelected.forEach(taskId=>{
    if(!weekAssignments[date].some(a=>a.taskId===taskId&&a.catId===assignCat)){
      weekAssignments[date].push({taskId,catId:assignCat,done:false});added++;
    }
  });
  assignSelected=[];save();
  renderSchedule();

function shiftWeek(dir){weekStart=new Date(weekStart);weekStart.setDate(weekStart.getDate()+dir*7);renderSchedule()}
function goThisWeek(){weekStart=getMonday(new Date());renderSchedule()}
function copyWeek(){const dates=getWeekDates(weekStart);const nm=new Date(weekStart);nm.setDate(nm.getDate()+7);const nd=getWeekDates(nm);let c=0;dates.forEach((d,i)=>{const a=weekAssignments[d];if(!a||!a.length)return;const t=nd[i];if(!weekAssignments[t])weekAssignments[t]=[];a.forEach(x=>{if(!weekAssignments[t].some(y=>y.taskId===x.taskId&&y.catId===x.catId)){weekAssignments[t].push({taskId:x.taskId,catId:x.catId,done:false});c++}})});save();const msg=document.getElementById('copy-week-msg');msg.textContent=c?`Copied ${c} task${c>1?'s':''}!`:'Nothing to copy';setTimeout(()=>{msg.textContent=''},3000)}
function unassignTask(d,i){if(weekAssignments[d]){weekAssignments[d].splice(i,1);if(!weekAssignments[d].length)delete weekAssignments[d];save();renderSchedule()}}
function toggleWeekTask(d,i){if(weekAssignments[d]?.[i]){weekAssignments[d][i].done=!weekAssignments[d][i].done;const a=weekAssignments[d][i];const t=findTask(a.catId,a.taskId);if(t)t.done=a.done;save();renderSchedule()}}
function moveToTomorrow(d,i){const a=weekAssignments[d]?.[i];if(!a)return;weekAssignments[d].splice(i,1);if(!weekAssignments[d].length)delete weekAssignments[d];const nd=parseDate(d);nd.setDate(nd.getDate()+1);const ns=fmtDate(nd);if(!weekAssignments[ns])weekAssignments[ns]=[];a.done=false;weekAssignments[ns].push(a);save();renderSchedule()}

/* DRAG */
let dragData=null;
function onDragStartWeek(e,d,i){dragData={type:'week',fromDate:d,idx:i};e.dataTransfer.effectAllowed='move';e.target.classList.add('dragging')}
function onDragOver(e){e.preventDefault();e.currentTarget.classList.add('drag-over');const dz=e.currentTarget.querySelector('.day-drop-zone');if(dz)dz.classList.add('active')}
function onDragLeave(e){if(!e.currentTarget.contains(e.relatedTarget)){e.currentTarget.classList.remove('drag-over');const dz=e.currentTarget.querySelector('.day-drop-zone');if(dz)dz.classList.remove('active')}}
function onDrop(e,dateStr){e.preventDefault();e.currentTarget.classList.remove('drag-over');const dz=e.currentTarget.querySelector('.day-drop-zone');if(dz)dz.classList.remove('active');if(!dragData)return;if(dragData.type==='week'){const a=weekAssignments[dragData.fromDate]?.[dragData.idx];if(a&&dragData.fromDate!==dateStr){weekAssignments[dragData.fromDate].splice(dragData.idx,1);if(!weekAssignments[dragData.fromDate].length)delete weekAssignments[dragData.fromDate];if(!weekAssignments[dateStr])weekAssignments[dateStr]=[];weekAssignments[dateStr].push(a)}}dragData=null;save();renderSchedule()}

/* DAY VIEW — TIMELINE */
let dayTimeSlots={};// {date: [{id,type:'task'|'event',catId?,taskId?,name,start:'HH:MM',dur:minutes,done?}]}
try{const raw=localStorage.getItem('dp-timeslots');if(raw)dayTimeSlots=JSON.parse(raw)}catch(e){}
function saveTimeSlots(){localStorage.setItem('dp-timeslots',JSON.stringify(dayTimeSlots))}

function durToMin(dur){if(!dur)return 30;const m=dur.match(/(\d+\.?\d*)\s*h/);if(m)return Math.round(parseFloat(m[1])*60);const m2=dur.match(/(\d+)\s*m/);return m2?parseInt(m2[1]):30}
function minToDurStr(m){if(m>=60){const h=Math.floor(m/60);const r=m%60;return r?`${h}h ${r}m`:`${h}h`}return`${m}m`}
function addMinutes(timeStr,mins){const[h,m]=timeStr.split(':').map(Number);const total=h*60+m+mins;const nh=Math.floor(total/60)%24;const nm=total%60;return String(nh).padStart(2,'0')+':'+String(nm).padStart(2,'0')}

function buildDaySlots(dateStr){
  // Merge calendar events + assigned tasks into time slots for this day
  const slots=dayTimeSlots[dateStr]||[];
  const evts=(calEvents[dateStr]||[]);
  const assigned=weekAssignments[dateStr]||[];

  // Ensure events are in slots
  evts.forEach(ev=>{
    const eid='ev-'+ev.name+'-'+(ev.start||'');
    if(!slots.find(s=>s.id===eid)){
      const durMin=ev.start&&ev.end?((parseInt(ev.end.split(':')[0])*60+parseInt(ev.end.split(':')[1]))-(parseInt(ev.start.split(':')[0])*60+parseInt(ev.start.split(':')[1]))):60;
      slots.push({id:eid,type:'event',name:ev.name,start:ev.start||'09:00',dur:Math.max(durMin,15)});
    }
  });

  // Ensure assigned tasks are in slots (unscheduled if no time set)
  assigned.forEach((a,idx)=>{
    const tid='task-'+a.catId+'-'+a.taskId;
    if(!slots.find(s=>s.id===tid)){
      const task=findTask(a.catId,a.taskId);
      if(!task)return;
      slots.push({id:tid,type:'task',catId:a.catId,taskId:a.taskId,name:task.text,start:'',dur:durToMin(task.dur),done:a.done||false});
    } else {
      // sync done state
      const s=slots.find(s=>s.id===tid);
      if(s)s.done=a.done||false;
    }
  });

  // Remove slots for tasks that were unassigned
  const validTaskIds=assigned.map(a=>'task-'+a.catId+'-'+a.taskId);
  const validEvIds=evts.map(ev=>'ev-'+ev.name+'-'+(ev.start||''));
  const filtered=slots.filter(s=>{
    if(s.type==='event')return validEvIds.includes(s.id);
    if(s.type==='task')return validTaskIds.includes(s.id);
    return true;
  });

  dayTimeSlots[dateStr]=filtered;
  saveTimeSlots();
  return filtered;
}

function setSlotTime(dateStr,slotId,hour,minute){
  const slots=dayTimeSlots[dateStr]||[];
  const s=slots.find(x=>x.id===slotId);
  if(s){
    s.start=String(hour).padStart(2,'0')+':'+String(minute).padStart(2,'0');
    saveTimeSlots();
    renderSchedule();
  }
}
function clearSlotTime(dateStr,slotId){
  const slots=dayTimeSlots[dateStr]||[];
  const s=slots.find(x=>x.id===slotId);
  if(s){s.start='';saveTimeSlots();renderSchedule()}
}
function setSlotDuration(dateStr,slotId,mins){
  const slots=dayTimeSlots[dateStr]||[];
  const s=slots.find(x=>x.id===slotId);
  if(s){s.dur=mins;saveTimeSlots();renderSchedule()}
}

function renderDayView(){
  const dateStr=viewDay;const d=parseDate(dateStr);const dayName=d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  const log=dailyLogs[dateStr]||{};
  const slots=buildDaySlots(dateStr);

  const scheduled=slots.filter(s=>s.start).sort((a,b)=>a.start.localeCompare(b.start));
  const unscheduled=slots.filter(s=>!s.start&&s.type==='task');

  // Determine hour range
  let startHour=6,endHour=22;
  if(scheduled.length){
    const firstH=parseInt(scheduled[0].start.split(':')[0]);
    const lastS=scheduled[scheduled.length-1];
    const lastEnd=parseInt(lastS.start.split(':')[0])+Math.ceil(lastS.dur/60);

    endHour=Math.max(endHour,lastEnd+1);

  let h=`<div class="day-view"><div class="sched-nav"><button class="btn btn-sm" onclick="shiftDay(-1)">←</button><div class="sched-nav-label">${dayName}</div><button class="btn btn-sm" onclick="shiftDay(1)">→</button><button class="btn btn-sm" onclick="goToday()">Today</button></div>`;

  h+=`<div class="timeline-wrap"><div class="timeline-header"><div class="timeline-header-title"><span class="dot" style="background:var(--work-bar)"></span>Schedule</div><div style="display:flex;gap:6px"><button class="btn btn-sm" onclick="autoScheduleDay('${dateStr}')">Auto-fill times</button></div></div>`;
  h+=`<div class="timeline" id="day-timeline">`;

  for(let hr=startHour;hr<=endHour;hr++){
    const hrStr=hr%12||12;const ampm=hr>=12?'PM':'AM';
    const slotsThisHour=scheduled.filter(s=>{const sh=parseInt(s.start.split(':')[0]);return sh===hr});

    h+=`<div class="timeline-hour-row" data-hour="${hr}"><div class="timeline-hour-label">${hrStr} ${ampm}</div><div class="timeline-hour-content" ondragover="onTimelineDragOver(event,${hr},'${dateStr}')" ondragleave="onTimelineDragLeave(event)" ondrop="onTimelineDrop(event,${hr},'${dateStr}')">`;
    h+=`<div class="timeline-half"></div>`;

      const cat=s.catId?CATS.find(c=>c.id===s.catId):null;

      h+=`<div class="timeline-block ${s.type==='event'?'timeline-block-event':'timeline-block-task'}" style="background:${bgColor};border-left-color:${borderColor};color:${txtColor}" ${isTask?`draggable="true" ondragstart="onTimelineDragStart(event,'${dateStr}','${s.id}')"`:''}>`

        h+=`<div class="timeline-block-check ${s.done?'done':''}" onclick="toggleTimelineTask('${dateStr}','${s.id}')"></div>`;
      }
      h+=`<div class="timeline-block-body"><div class="timeline-block-name ${isTask&&s.done?'done':''}">${esc(s.name)}</div>`;

      h+=`<span>${minToDurStr(s.dur)}</span>`;
      h+=`</div></div>`;

      if(isTask){
        h+=`<div class="timeline-block-actions">`;
        h+=`<select onchange="setSlotDuration('${dateStr}','${s.id}',parseInt(this.value))" style="padding:2px 4px;border:1px solid var(--border);border-radius:4px;font-size:10px;font-family:inherit;background:var(--surface)">`;

        h+=`<button title="Remove" onclick="removeDayTask2('${dateStr}','${s.id}')">✕</button>`;
        h+=`</div>`;
      }
      h+=`</div>`;
    });

    h+=`</div></div>`;
  }
  h+=`</div>`;// end .timeline

  // Unscheduled tasks
  if(unscheduled.length){
    h+=`<div class="timeline-unscheduled"><div class="timeline-unscheduled-title">Unscheduled tasks — drag onto timeline or set a time</div>`;
    unscheduled.forEach(s=>{
      const cat=s.catId?CATS.find(c=>c.id===s.catId):null;

      if(cat)h+=`<span class="task-tag" style="background:var(${cat.bg});color:var(${cat.txt})">${cat.name}</span>`;
      h+=`<span class="task-tag" style="background:var(--surface);color:var(--text-2)">${minToDurStr(s.dur)}</span>`;
      h+=`<div class="time-picker-inline"><select onchange="if(this.value)quickSchedule('${dateStr}','${s.id}',this.value)"><option value="">Set time</option>`;
      for(let hr=5;hr<=23;hr++){
        [0,30].forEach(m=>{
          const tv=String(hr).padStart(2,'0')+':'+String(m).padStart(2,'0');

        });

      h+=`<button class="btn btn-sm" style="padding:3px 8px;font-size:11px" onclick="removeDayTask2('${dateStr}','${s.id}')">✕</button>`;
      h+=`</div>`;
    });
    h+=`</div>`;
  }
  h+=`</div>`;// end .timeline-wrap

  // Daily Log
  h+=`<div class="day-section"><div class="day-section-title"><span class="dot" style="background:var(--school-bar)"></span>Daily Log</div><div class="log-form">
    <div class="log-field"><div class="log-field-label">Sleep (hours)</div><input type="number" min="0" max="24" step="0.5" value="${log.sleep||''}" onchange="saveDayLog('${dateStr}','sleep',this.value)" placeholder="e.g. 7.5"/></div>

  </div></div>`;

  // AI Day Optimizer

  h+=`<button class="btn btn-primary" onclick="generateDaySchedule('${dateStr}')" id="gen-day-btn">Optimize this day with AI</button><div class="ai-result" id="ai-day-result"></div></div>`;

  h+=`</div>`;// end .day-view

/* Timeline interactions */
function quickSchedule(dateStr,slotId,timeVal){
  const slots=dayTimeSlots[dateStr]||[];
  const s=slots.find(x=>x.id===slotId);
  if(s){s.start=timeVal;saveTimeSlots();renderSchedule()}
}
function toggleTimelineTask(dateStr,slotId){
  const slots=dayTimeSlots[dateStr]||[];
  const s=slots.find(x=>x.id===slotId);
  if(!s||s.type!=='task')return;
  s.done=!s.done;
  // sync with weekAssignments
  const assigned=weekAssignments[dateStr]||[];
  const a=assigned.find(x=>'task-'+x.catId+'-'+x.taskId===slotId);
  if(a)a.done=s.done;
  const task=findTask(s.catId,s.taskId);
  if(task)task.done=s.done;
  save();saveTimeSlots();renderSchedule();
}
function moveDayTask2(dateStr,slotId){
  // Move task to tomorrow
  const slots=dayTimeSlots[dateStr]||[];
  const sIdx=slots.findIndex(x=>x.id===slotId);
  if(sIdx<0)return;
  const s=slots[sIdx];
  if(s.type!=='task')return;
  // Remove from time slots
  slots.splice(sIdx,1);
  dayTimeSlots[dateStr]=slots;
  // Move in weekAssignments
  const assigned=weekAssignments[dateStr]||[];
  const aIdx=assigned.findIndex(x=>'task-'+x.catId+'-'+x.taskId===slotId);
  if(aIdx>=0){
    const a=assigned.splice(aIdx,1)[0];
    if(!assigned.length)delete weekAssignments[dateStr];
    const nd=parseDate(dateStr);nd.setDate(nd.getDate()+1);const ns=fmtDate(nd);
    if(!weekAssignments[ns])weekAssignments[ns]=[];
    a.done=false;weekAssignments[ns].push(a);
  }
  save();saveTimeSlots();renderSchedule();
}
function removeDayTask2(dateStr,slotId){
  const slots=dayTimeSlots[dateStr]||[];
  dayTimeSlots[dateStr]=slots.filter(x=>x.id!==slotId);
  // Also remove from weekAssignments
  const assigned=weekAssignments[dateStr]||[];
  const aIdx=assigned.findIndex(x=>'task-'+x.catId+'-'+x.taskId===slotId);
  if(aIdx>=0){assigned.splice(aIdx,1);if(!assigned.length)delete weekAssignments[dateStr]}
  save();saveTimeSlots();renderSchedule();
}
function autoScheduleDay(dateStr){
  // Simple auto-scheduler: place unscheduled tasks in gaps
  const slots=dayTimeSlots[dateStr]||[];
  const scheduled=slots.filter(s=>s.start).sort((a,b)=>a.start.localeCompare(b.start));
  const unscheduled=slots.filter(s=>!s.start&&s.type==='task');
  if(!unscheduled.length)return;

  // Find gaps starting at 8am
  let cursor='08:00';
  const busyRanges=scheduled.map(s=>({start:s.start,end:addMinutes(s.start,s.dur)}));

  unscheduled.forEach(s=>{
    // Advance cursor past any conflicts
    let attempts=0;
    while(attempts<50){
      const curEnd=addMinutes(cursor,s.dur);
      const conflict=busyRanges.find(b=>cursor<b.end&&curEnd>b.start);
      if(!conflict)break;
      cursor=conflict.end;
      // Add 10 min buffer
      cursor=addMinutes(cursor,10);
      attempts++;
    }
    s.start=cursor;
    busyRanges.push({start:cursor,end:addMinutes(cursor,s.dur)});
    busyRanges.sort((a,b)=>a.start.localeCompare(b.start));
    cursor=addMinutes(cursor,s.dur+10);
  });
  saveTimeSlots();renderSchedule();
}

/* Timeline drag & drop */
let timelineDrag=null;
function onTimelineDragStart(e,dateStr,slotId){
  timelineDrag={dateStr,slotId};
  e.dataTransfer.effectAllowed='move';
  e.target.classList.add('dragging');
}
function onTimelineDragOver(e,hour,dateStr){
  e.preventDefault();
  e.currentTarget.style.background='var(--work-bg)';
}
function onTimelineDragLeave(e){
  e.currentTarget.style.background='';
}
function onTimelineDrop(e,hour,dateStr){
  e.preventDefault();
  e.currentTarget.style.background='';
  if(!timelineDrag)return;
  const slots=dayTimeSlots[timelineDrag.dateStr]||[];
  const s=slots.find(x=>x.id===timelineDrag.slotId);
  if(s){
    // Calculate minute from mouse position
    const rect=e.currentTarget.getBoundingClientRect();
    const pct=(e.clientY-rect.top)/rect.height;
    const minute=pct<0.5?0:30;
    s.start=String(hour).padStart(2,'0')+':'+String(minute).padStart(2,'0');
    saveTimeSlots();
  }
  timelineDrag=null;
  renderSchedule();
}

/* ==================== AI ==================== */
function getApiKey(){
  const el=document.getElementById('ai-api-key');
  if(el&&el.value.trim())return el.value.trim();
  return loadApiKey();
}
function saveApiKey(key){try{localStorage.setItem('dp-api-key',key)}catch(e){}}
function loadApiKey(){try{return localStorage.getItem('dp-api-key')||''}catch(e){return''}}

function callClaude(prompt,btn,result,originalLabel){
  const apiKey=getApiKey();
  if(!apiKey){
    result.innerHTML='<span style="color:#C62828">⚠ Please enter your Anthropic API key. Get one free at <a href="https://console.anthropic.com" target="_blank" style="color:var(--work-bar);text-decoration:underline">console.anthropic.com</a></span>';
    if(btn){btn.disabled=false;btn.textContent=originalLabel}
    return;
  }
  saveApiKey(apiKey);
  if(btn){btn.disabled=true;btn.textContent='Generating...'}
  result.innerHTML='<span style="color:var(--text-3)">Thinking... this may take 10–20 seconds.</span>';

  fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key':apiKey,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:2000,messages:[{role:'user',content:prompt}]})
  })
  .then(r=>{if(!r.ok)return r.json().then(d=>{throw new Error(d.error?.message||'API error '+r.status)}).catch(e=>{if(e.message.includes('API error')||e.message.includes('Invalid'))throw e;throw new Error('Request failed (status '+r.status+'). Check your API key.')});return r.json()})
  .then(data=>{
    if(data.error){result.innerHTML='<span style="color:#C62828">Error: '+esc(data.error.message||JSON.stringify(data.error))+'</span>'}
    else{result.textContent=data.content?.map(b=>b.text||'').join('\n')||'No response.'}
    if(btn){btn.disabled=false;btn.textContent=originalLabel}
  })
  .catch(err=>{
    let msg=err.message||'Unknown error';
    if(msg.includes('Failed to fetch')||msg.includes('NetworkError'))msg='Network error — check your API key is valid. CORS errors usually mean the key is wrong.';
    result.innerHTML='<span style="color:#C62828">⚠ '+esc(msg)+'</span>';
    if(btn){btn.disabled=false;btn.textContent=originalLabel}
  });
}

function generateWeekSchedule(){
  const btn=document.getElementById('gen-btn');
  const result=document.getElementById('ai-result');
  const wake=document.getElementById('ai-wake').value||'07:00';
  const sleep=document.getElementById('ai-sleep').value||'22:30';
  const dates=getWeekDates(weekStart);
  let evStr='';dates.forEach((d,i)=>{const ev=calEvents[d]||[];if(ev.length){evStr+=`\n${DAYNAMES[i]} (${d}):\n`;ev.forEach(e=>evStr+=`  ${e.start||'?'}-${e.end||'?'}: ${e.name}\n`)}});
  let aStr='';dates.forEach((d,i)=>{const a=weekAssignments[d]||[];if(a.length){aStr+=`\n${DAYNAMES[i]}: `+a.map(x=>{const t=findTask(x.catId,x.taskId);return t?`${t.text} (${t.dur||'?'})${x.done?' [DONE]':''}`:'?'}).join(', ')}});
  const unassigned=CATS.flatMap(c=>tasks[c.id].filter(t=>!t.done).map(t=>({...t,cat:c.name}))).filter(t=>!Object.values(weekAssignments).flat().some(a=>a.taskId===t.id));
  const uStr=unassigned.map(t=>`[${t.cat}] ${t.text} (${t.dur||'no est'})`).join('\n');
  const prompt=`You are a weekly schedule optimizer. Create a realistic, balanced week plan.\n\nWake: ${wake} | Sleep: ${sleep}\n\nCALENDAR EVENTS (fixed):\n${evStr||'(none)'}\n\nALREADY ASSIGNED:\n${aStr||'(none)'}\n\nUNASSIGNED TASKS:\n${uStr||'(none)'}\n\nRules:\n- Calendar events are FIXED\n- Keep assigned tasks on their days\n- Distribute unassigned evenly\n- High-focus work in mornings\n- Include breaks, meals\n- Format: === DAY (date) ===\\n  TIME — Activity (dur)\n- Be practical and human`;
  callClaude(prompt,btn,result,'Generate optimized week');
}

function generateDaySchedule(dateStr){
  const btn=document.getElementById('gen-day-btn');
  const result=document.getElementById('ai-day-result');
  const d=parseDate(dateStr);
  const dayName=d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  const log=dailyLogs[dateStr]||{};
  const evts=(calEvents[dateStr]||[]).sort((a,b)=>(a.start||'').localeCompare(b.start||''));
  const assigned=weekAssignments[dateStr]||[];

  let evStr='';evts.forEach(e=>{evStr+=`  ${e.start||'?'}-${e.end||'?'}: ${e.name}\n`});
  let taskStr='';assigned.forEach(a=>{const t=findTask(a.catId,a.taskId);if(!t)return;const cat=CATS.find(c=>c.id===a.catId);taskStr+=`  [${cat?.name||'?'}] ${t.text} (${t.dur||'no estimate'})${a.done?' [DONE]':''}\n`});

  const prompt=`Create a realistic, time-blocked schedule for ${dayName}.\n\nSleep last night: ${log.sleep||'not logged'} hours\nEnergy: ${log.energy||'not logged'}/10\nMood: ${log.mood?['','rough','meh','good','great'][log.mood]:'not logged'}\n\nFIXED EVENTS:\n${evStr||'(none)'}\n\nTASKS FOR TODAY:\n${taskStr||'(none)'}\n\nRules:\n- Events are FIXED at their times\n- High-focus work during peak energy (morning)\n- If low energy/sleep, go easier\n- Include breaks, meals, transitions\n- Format: TIME — Activity (duration)\n- Keep it practical`;
  callClaude(prompt,btn,result,'Optimize this day with AI');
}

/* DATA */
let dataRange='7';
function setRange(r,btn){document.querySelectorAll('.range-tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');dataRange=r;document.getElementById('custom-range').classList.toggle('show',r==='custom');if(r!=='custom')renderDataPage()}
function getDateRange(){const today=new Date();let from,to=new Date(today);if(dataRange==='custom'){const fv=document.getElementById('data-from').value;const tv=document.getElementById('data-to').value;from=fv?new Date(fv+'T12:00:00'):new Date(today.getTime()-7*86400000);to=tv?new Date(tv+'T12:00:00'):today}else{from=new Date(today.getTime()-(parseInt(dataRange)-1)*86400000)}const dates=[];const cur=new Date(from);while(cur<=to){dates.push(fmtDate(cur));cur.setDate(cur.getDate()+1)}return dates}
function renderDataPage(){const dates=getDateRange();const logs=dates.map(d=>({date:d,log:dailyLogs[d]||null}));const hasData=logs.some(l=>l.log);const grid=document.getElementById('chart-grid');if(!hasData){grid.innerHTML='<div class="chart-card full"><div class="chart-empty">No log data yet. Use the Day view to log.</div></div>';return}grid.innerHTML=`<div class="chart-card"><div class="chart-title">Sleep</div><div class="chart-subtitle">Hours/night</div><canvas id="c-sleep" width="400" height="180"></canvas></div><div class="chart-card"><div class="chart-title">Energy</div><div class="chart-subtitle">1–10</div><canvas id="c-energy" width="400" height="180"></canvas></div><div class="chart-card"><div class="chart-title">Mood</div><div class="chart-subtitle">😫→😄</div><canvas id="c-mood" width="400" height="180"></canvas></div><div class="chart-card"><div class="chart-title">Tasks Done</div><div class="chart-subtitle">Per day</div><canvas id="c-tasks" width="400" height="180"></canvas></div><div class="chart-card full"><div class="chart-title">Meals</div><div class="chart-subtitle">Recent</div><div id="meals-log"></div></div>`;requestAnimationFrame(()=>{dL('c-sleep',logs,l=>l.log?.sleep,{min:0,max:12,color:'#534AB7',fill:'rgba(83,74,183,.1)'});dL('c-energy',logs,l=>l.log?.energy,{min:0,max:10,color:'#185FA5',fill:'rgba(24,95,165,.1)'});dB('c-mood',logs,l=>l.log?.mood,{min:0,max:4,colors:['#A32D2D','#BA7517','#1D9E75','#1D9E75']});const tl=dates.map(d=>({date:d,log:{c:(weekAssignments[d]||[]).filter(x=>x.done).length}}));dB('c-tasks',tl,l=>l.log?.c,{min:0,max:null,color:'#1D9E75'});rM(logs)})}
function dL(id,logs,g,o){const c=document.getElementById(id);if(!c)return;const r=c.parentElement.getBoundingClientRect();c.width=r.width-36;c.height=180;const x=c.getContext('2d');const W=c.width,H=c.height;const p={t:10,r:10,b:26,l:32};const cW=W-p.l-p.r,cH=H-p.t-p.b;const v=logs.map(g);const mx=o.max||Math.max(...v.filter(n=>n!=null),1);const mn=o.min;x.strokeStyle='rgba(0,0,0,.06)';x.lineWidth=1;for(let i=0;i<=4;i++){const y=p.t+cH-cH*(i/4);x.beginPath();x.moveTo(p.l,y);x.lineTo(W-p.r,y);x.stroke();x.fillStyle='#a09d97';x.font='10px DM Sans';x.textAlign='right';x.fillText(Math.round(mn+(mx-mn)*(i/4)),p.l-5,y+3)}const s=Math.max(1,Math.floor(logs.length/6));x.textAlign='center';logs.forEach((l,i)=>{if(i%s===0)x.fillText(l.date.slice(5),p.l+(i/(logs.length-1||1))*cW,H-4)});const pts=[];v.forEach((n,i)=>{if(n!=null)pts.push({x:p.l+(i/(logs.length-1||1))*cW,y:p.t+cH-((n-mn)/(mx-mn||1))*cH})});if(pts.length<2)return;x.beginPath();x.moveTo(pts[0].x,p.t+cH);pts.forEach(pt=>x.lineTo(pt.x,pt.y));x.lineTo(pts[pts.length-1].x,p.t+cH);x.closePath();x.fillStyle=o.fill;x.fill();x.beginPath();x.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)x.lineTo(pts[i].x,pts[i].y);x.strokeStyle=o.color;x.lineWidth=2.5;x.lineJoin='round';x.stroke();pts.forEach(pt=>{x.beginPath();x.arc(pt.x,pt.y,3.5,0,Math.PI*2);x.fillStyle='#fff';x.fill();x.strokeStyle=o.color;x.lineWidth=2;x.stroke()})}
function dB(id,logs,g,o){const c=document.getElementById(id);if(!c)return;const r=c.parentElement.getBoundingClientRect();c.width=r.width-36;c.height=180;const x=c.getContext('2d');const W=c.width,H=c.height;const p={t:10,r:10,b:26,l:32};const cW=W-p.l-p.r,cH=H-p.t-p.b;const v=logs.map(g);const mx=o.max||Math.max(...v.filter(n=>n!=null),1);x.strokeStyle='rgba(0,0,0,.06)';x.lineWidth=1;const gs=Math.min(mx,4);for(let i=0;i<=gs;i++){const y=p.t+cH-cH*(i/gs);x.beginPath();x.moveTo(p.l,y);x.lineTo(W-p.r,y);x.stroke();x.fillStyle='#a09d97';x.font='10px DM Sans';x.textAlign='right';x.fillText(Math.round(mx*(i/gs)),p.l-5,y+3)}const bW=Math.min(20,cW/logs.length*.6);const gap=(cW-bW*logs.length)/(logs.length+1);logs.forEach((l,i)=>{const n=g(l);if(n==null)return;const lx=p.l+gap+(bW+gap)*i;const bH=(n/(mx||1))*cH;const y=p.t+cH-bH;let cl=o.color||'#1D9E75';if(o.colors&&n>=1&&n<=o.colors.length)cl=o.colors[n-1];x.fillStyle=cl;const rd=Math.min(3,bW/2);x.beginPath();x.moveTo(lx,p.t+cH);x.lineTo(lx,y+rd);x.quadraticCurveTo(lx,y,lx+rd,y);x.lineTo(lx+bW-rd,y);x.quadraticCurveTo(lx+bW,y,lx+bW,y+rd);x.lineTo(lx+bW,p.t+cH);x.closePath();x.fill()});x.fillStyle='#a09d97';x.font='10px DM Sans';x.textAlign='center';const s=Math.max(1,Math.floor(logs.length/6));logs.forEach((l,i)=>{if(i%s===0)x.fillText(l.date.slice(5),p.l+gap+(bW+gap)*i+bW/2,H-4)})}
function rM(logs){const el=document.getElementById('meals-log');const rc=logs.filter(l=>l.log&&(l.log.breakfast||l.log.lunch||l.log.dinner||l.log.snack1||l.log.snack2||l.log.hydration)).slice(-10).reverse();if(!rc.length){el.innerHTML='<span style="color:var(--text-3);font-size:13px">No meal data.</span>';return}el.innerHTML=rc.map(l=>{const m=[];if(l.log.breakfast)m.push('B: '+esc(l.log.breakfast));if(l.log.snack1)m.push('S1: '+esc(l.log.snack1));if(l.log.lunch)m.push('L: '+esc(l.log.lunch));if(l.log.snack2)m.push('S2: '+esc(l.log.snack2));if(l.log.dinner)m.push('D: '+esc(l.log.dinner));if(l.log.hydration)m.push('💧 '+esc(l.log.hydration));return`<div style="margin-bottom:6px;font-size:13px"><strong style="font-weight:500">${l.date.slice(5)}</strong> — <span style="color:var(--text-2)">${m.join(' · ')}</span></div>`}).join('')}
